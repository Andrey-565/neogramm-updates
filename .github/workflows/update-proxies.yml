name: Update Proxy List

on:
  schedule:
    # Каждый час
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run proxy checker
        run: python scripts/update_proxies.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes, nothing to commit"
          else
            git config user.name "proxies-bot"
            git config user.email "proxies-bot@users.noreply.github.com"
            git add proxies.json
            git commit -m "chore: update proxy list"
            git push origin main
            echo "Proxy list updated"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
